<!DOCTYPE html>
<html>
<head>
    
    <title>Border Radius</title>
    <style>
        .text {
            background-color:#99c2ff;
            color:brown;

            border:double royalblue 4px;

            border-radius: 10px;
        }
    </style>

</head>
<body>
    <div class="text">
        CSS (Cascading Style Sheets) is a style sheet language used to describe the presentation, layout, and visual formatting of a document written in a markup language like HTML or XML. Along with HTML and JavaScript, CSS is a cornerstone technology of the World Wide Web.
    </div>
    
</body>
</html>
