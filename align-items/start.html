<!DOCTYPE html>
<html>
<head>
    <title>Align-items-start</title>
    <style>
        .child {
            background-color: tomato;
            height: 100px;
            width: 100px;
            border: 1px solid black;
            margin: 5px;
            font-size: 30px;
        
        }
        .parent {
            display: flex;
            flex-direction: row;
            justify-content: space-around;
            align-items:start;

            background-color: aquamarine;
            padding: 5px;
            height: 200px;
            border: 1px solid black;
        }
    </style>
</head>
<body>
    <div class="parent">
        <div class="child">A</div>
        <div class="child">B</div>
        <div class="child">C</div>
        <div class="child">D</div>
        <div class="child">E</div>
        
    </div>
    
</body>
</html>
