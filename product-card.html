<!DOCTYPE html>
<html>

<head>
    <title>product card</title>
    <style>
        .product-img {
            height: 100px;
            display: block;
            margin-left: auto;
            margin-right: auto;
            margin-top: 10px;
            margin-bottom: 10px;
            border-radius: 10px;
        }

        .product-card {
            border: double 4px palevioletred;
            width: 170px;
            margin: 20px;
            padding: 10px;
            border-radius: 10px;
            background-color: lightpink;
        }

        .product-descreption {
            font-size: 12px;
        }

        .product-name {
            margin: 0%;
        }

        .btn-buy {
            display: block;
            margin-left: auto;
            margin-right: auto;
            padding: 5px 20px;
            border: none;
            background-color: #800040;
            color: cornsilk;
            border-radius: 4px;
        }
    </style>
</head>

<body>
    <div class="product-card">
        <img src="Shoes.png" class="product-img" />

        <h3 class="product-name">Sneakers Shoes</h3>
        <P class="product-descreption">
            Sneakers shoes are comfortable, lightweight shoes mainly designed for sports and everyday use
        </P>
        <p class="product-descreption">
            Price:<del>₹3000/-</del>₹2500/-
        </p>
        <button class="btn-buy">Buy now</button>
    </div>

</body>

</html>
