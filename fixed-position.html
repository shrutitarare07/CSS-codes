<!DOCTYPE html>
<html>
<head>
    <title>fixed position</title>
    <style>
        .btn{
            color: black;
            border: none;
            border-radius: 5px;
        }
        .btn-cancel{
            background-color: tomato;
            position: fixed;
            bottom: 25px;
        }
        .btn-save{
            background-color: aquamarine;
           
        }
    </style>
</head>
<body>
    <button class="btn btn-cancel">cancel</button>
    <button class="btn btn-save">save</button>
</body>
</html>
