<!DOCTYPE html>
<html>

<head>

    <title>ID Selector</title>
    <style>
        h1 {
            color: #d279a6;
            font-size: 50px;
        }

        #name {
            color: red;
            font-size: 50px;
        }

        .text {
            color: #00b3b3;
        }
    </style>
</head>

<body>
    <h1>Welcome to my webpage</h1>

    <p id="name">
        CSS is very inteeresting
    </p>

    <p class="text">
        I am learning CSS
    </p>
    <p class="text">
        There are three types of selector
    </p>

</body>

</html>
