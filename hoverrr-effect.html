<!DOCTYPE html>
<html>
<head>
    
    <title>Hover Effect</title>
    <style>
        .text {
            background-color: blueviolet;
            height: 100px;
            width: 200px;
            transition: 0.5s;
            border: double 4px transparent;
            
        }
        .text:hover {
            background-color: aquamarine;
            border-radius: 10px;
            height: 150px;
            width: 250px;
            border: black;
        }
    </style>
</head>
<body>
    <div class="text">

    </div>
    
</body>
</html>
