<!DOCTYPE html>
<html>
<head>
    <title>Absolute-position</title>
    <style>
        .card{
            background-color: brown;
            height: 100px;
            width: 200px;
            padding: 10px;
            position: absolute;
        }
        .btn{
            position: absolute;
            bottom: 20px;
            right: 10px;
        }
    </style>
</head>
<body>
    <div class="card">
        <button class="btn">click me</button>
    </div>
    
</body>
</html>
