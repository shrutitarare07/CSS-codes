<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box-Center</title>
    <style>
        body {
            background-color: #ffb380;
            margin: 0;
            padding: 0;
        }

        .outer-wrapper {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .parent {
            display: flex;
            justify-content: center;
            align-items: center;
            border: 1px solid black;
            height: 100px;
            width: 100px;
        }
    </style>
</head>

<body>
    <div class="outer-wrapper">
        <div class="parent">
            <i class="fa-solid fa-house-user"></i>
        </div>
    </div>
    <script src="https://kit.fontawesome.com/ea1b6ff3d9.js" crossorigin="anonymous"></script>
</body>

</html>
